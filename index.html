<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f0ece3">
  <title>Cartes de couple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cartes de couple</h1>

  <div class="mode-toggle">
    <span class="mode-label active" id="mode-label-debut">Début</span>
    <div class="mode-switch" id="mode-switch"></div>
    <span class="mode-label" id="mode-label-avance">Avancé</span>
  </div>

  <div class="filters" id="filters"></div>

  <div class="card-container">
    <div class="card-bg"></div>
    <div class="card-bg"></div>
    <div class="card" id="card">
      <span class="category" id="category"></span>
      <p class="question" id="question"></p>
      <p class="empty-msg" id="empty-msg">Sélectionne au moins une catégorie</p>
      <span class="counter" id="counter"></span>
    </div>
  </div>

  <p class="hint">Appuie ou glisse pour la carte suivante</p>

  <script>
    const categoryClass = {
      "Découverte": "cat-decouverte",
      "Léger": "cat-leger",
      "Rêves": "cat-reves",
      "Perso": "cat-perso",
      "Valeurs": "cat-valeurs",
      "Intimité": "cat-intimite",
    };

    const categories = Object.keys(categoryClass);
    const activeCategories = new Set(categories);
    let activeLevel = "debut";
    let allCards = [];
    let deck = [];
    let current = 0;
    let animating = false;

    const filtersEl = document.getElementById("filters");
    const cardEl = document.getElementById("card");
    const categoryEl = document.getElementById("category");
    const questionEl = document.getElementById("question");
    const counterEl = document.getElementById("counter");
    const emptyEl = document.getElementById("empty-msg");
    const modeSwitchEl = document.getElementById("mode-switch");
    const modeLabelDebut = document.getElementById("mode-label-debut");
    const modeLabelAvance = document.getElementById("mode-label-avance");

    // Load questions then init
    fetch("questions.json")
      .then(r => r.json())
      .then(data => {
        allCards = data;
        buildDeck();
      });

    // Mode toggle
    modeSwitchEl.addEventListener("click", () => {
      if (activeLevel === "debut") {
        activeLevel = "avance";
        modeSwitchEl.classList.add("advanced");
        modeLabelDebut.classList.remove("active");
        modeLabelAvance.classList.add("active");
      } else {
        activeLevel = "debut";
        modeSwitchEl.classList.remove("advanced");
        modeLabelAvance.classList.remove("active");
        modeLabelDebut.classList.add("active");
      }
      buildDeck();
    });

    // Build filter buttons
    const filterBtns = [];
    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn " + categoryClass[cat];
      btn.textContent = cat;
      btn.addEventListener("click", () => {
        if (activeCategories.has(cat)) {
          activeCategories.delete(cat);
          btn.classList.add("off");
        } else {
          activeCategories.add(cat);
          btn.classList.remove("off");
        }
        buildDeck();
      });
      filtersEl.appendChild(btn);
      filterBtns.push(btn);
    });

    // Toggle all button
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "toggle-all-btn";
    toggleBtn.textContent = "Aucune";
    toggleBtn.addEventListener("click", () => {
      const allActive = activeCategories.size === categories.length;
      if (allActive) {
        activeCategories.clear();
        filterBtns.forEach(b => b.classList.add("off"));
        toggleBtn.textContent = "Toutes";
      } else {
        categories.forEach(c => activeCategories.add(c));
        filterBtns.forEach(b => b.classList.remove("off"));
        toggleBtn.textContent = "Aucune";
      }
      buildDeck();
    });
    filtersEl.appendChild(toggleBtn);

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildDeck() {
      deck = shuffle(allCards.filter(c => activeCategories.has(c.category) && c.level === activeLevel));
      current = 0;
      renderCard();
    }

    function renderCard() {
      const empty = deck.length === 0;
      categoryEl.style.display = empty ? "none" : "";
      questionEl.style.display = empty ? "none" : "";
      counterEl.style.display = empty ? "none" : "";
      emptyEl.style.display = empty ? "" : "none";
      if (empty) return;

      const c = deck[current];
      categoryEl.textContent = c.category;
      categoryEl.className = "category " + categoryClass[c.category];
      questionEl.innerHTML = c.question.replace(/ \?/g, "\u00a0?");
      counterEl.textContent = (current + 1) + " / " + deck.length;
    }

    function nextCard() {
      if (animating || deck.length === 0) return;
      animating = true;

      cardEl.classList.add("exit-left");

      setTimeout(() => {
        current = (current + 1) % deck.length;
        renderCard();
        cardEl.classList.remove("exit-left");
        cardEl.classList.add("enter-right");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            cardEl.classList.remove("enter-right");
            animating = false;
          });
        });
      }, 350);
    }

    function prevCard() {
      if (animating || deck.length === 0 || current === 0) return;
      animating = true;

      cardEl.classList.add("exit-right");

      setTimeout(() => {
        current--;
        renderCard();
        cardEl.classList.remove("exit-right");
        cardEl.classList.add("enter-left");

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            cardEl.classList.remove("enter-left");
            animating = false;
          });
        });
      }, 350);
    }

    cardEl.addEventListener("click", nextCard);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextCard();
      if (e.key === "ArrowLeft") prevCard();
    });

    // Touch swipe support
    let touchStartX = 0;
    cardEl.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    cardEl.addEventListener("touchend", (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (diff > 40) nextCard();
      if (diff < -40) prevCard();
    });
  </script>
</body>
</html>
